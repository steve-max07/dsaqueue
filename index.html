<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hospital Queue</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 20px auto; padding: 0 20px; }
        .grid { display: flex; gap: 20px; margin-bottom: 20px; }
        .card { flex: 1; border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
        input, button { width: 100%; box-sizing: border-box; padding: 10px; margin-top: 10px; }
        button { background: #007bff; color: white; border: none; cursor: pointer; font-weight: bold; }
        button.doctor { background: #dc3545; }
        .monitor { background: #f8f9fa; border: 1px solid #ddd; padding: 15px; border-radius: 5px; min-height: 50px; }
        .row { border-bottom: 1px solid #eee; padding: 8px 0; display: flex; justify-content: space-between; }
    </style>
</head>
<body>

    <h2>Hospital Queue System</h2>

    <div class="grid">
        <!-- 1. Kiosk Form -->
        <div class="card">
            <h3>🎫 Patient Registration</h3>
            <form id="regForm">
                <input type="text" id="name" placeholder="Patient Name" required>
                <input type="number" id="age" placeholder="Age" required>
                <input type="text" id="ailment" placeholder="Ailment" required>
                <button type="submit">Get Token</button>
            </form>
        </div>

        <!-- 2. Doctor Actions -->
        <div class="card">
            <h3>🚨 Doctor Panel</h3>
            <button class="doctor" onclick="callNext()">Call Next Patient</button>
            <p id="servingBox" style="display:none; margin-top:15px; background:#fff3cd; padding:10px; border-radius:5px;"></p>
        </div>
    </div>

    <!-- 3. Waiting List Display -->
    <div class="card">
        <h3>📋 Waiting Queue (<span id="count">0</span> patients waiting)</h3>
        <div id="monitorBox" class="monitor">Loading queue...</div>
    </div>

    <script>
        // Send registration form data to Python via POST
        document.getElementById('regForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const params = new URLSearchParams({
                name: document.getElementById('name').value,
                age: document.getElementById('age').value,
                ailment: document.getElementById('ailment').value
            });
            
            let res = await fetch('http://127.0.0.1:5000/api/register', { method: 'POST', body: params });
            let data = await res.json();
            if (data.id) {
                alert("Registered! Assigned Token ID: " + data.id);
                document.getElementById('regForm').reset();
                updateList();
            }
        });

        // Trigger the C program to pop (dequeue) the next patient 
        async function callNext() {
            let res = await fetch('http://127.0.0.1:5000/api/dequeue', { method: 'POST' });
            let data = await res.json();
            const box = document.getElementById('servingBox');
            box.style.display = 'block';
            
            if (data.status === 'called') {
                box.innerHTML = `<strong>Now Treating:</strong> ${data.name} <br> <small>ID: ${data.id} | Age: ${data.age} | Reason: ${data.ailment}</small>`;
            } else {
                box.innerHTML = "<strong>Queue is empty.</strong> No patients waiting.";
            }
            updateList();
        }

        // Fetch the full active waiting array layout from C via Python
        async function updateList() {
            let res = await fetch('http://127.0.0.1:5000/api/list');
            let data = await res.json();
            document.getElementById('count').innerText = data.length;
            const container = document.getElementById('monitorBox');
            
            if (data.length === 0) {
                container.innerHTML = "No patients currently waiting.";
                return;
            }
            
            container.innerHTML = data.map(p => `
                <div class="row">
                    <span><strong>ID: ${p.id}</strong> - ${p.name} (${p.age} yrs)</span>
                    <span style="color:#666; font-style:italic;">${p.ailment}</span>
                </div>
            `).join('');
        }

        // Automatically fetch and refresh the board display view every 3 seconds
        setInterval(updateList, 3000);
        updateList();
    </script>

</body>
</html
